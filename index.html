<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Công cụ chuyển giọng nói thành văn bản trực tiếp trên trình duyệt bằng Web Speech API.">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f172a'/><circle cx='16' cy='14' r='5' fill='%236366f1'/><path d='M10 16a6 6 0 0 0 12 0M16 22v4m-4 0h8' stroke='%236366f1' stroke-width='2' fill='none' stroke-linecap='round'/></svg>">
    <title>Speech to Text — Chuyển giọng nói thành văn bản</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-raised: #273449;
            --border: #334155;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --radius: 14px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99, 102, 241, 0.15), transparent),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .app {
            width: min(720px, 100%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        header {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            margin-bottom: 1.75rem;
        }

        .mic-badge {
            width: 46px; height: 46px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .mic-badge.listening {
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.5); }
            50% { box-shadow: 0 0 0 12px rgba(99, 102, 241, 0); }
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        header p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        #status {
            min-height: 1.4rem;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #status.listening { color: var(--success); }
        #status.listening::before {
            content: '';
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: blink 1.2s infinite;
        }
        @keyframes blink { 50% { opacity: 0.4; } }
        #status.error { color: var(--danger); }
        #status.unsupported { color: #fbbf24; }

        #output {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            min-height: 220px;
            max-height: 46vh;
            overflow-y: auto;
            padding: 1.1rem 1.25rem;
            font-size: 1.02rem;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            transition: border-color 0.2s;
        }
        #output:focus-within { border-color: var(--accent); }
        #output:empty::after {
            content: 'Nội dung văn bản sẽ xuất hiện ở đây khi bạn bắt đầu nói...';
            color: var(--text-muted);
            font-style: italic;
        }
        #output .interim { color: var(--text-muted); }

        .toolbar {
            display: flex;
            gap: 0.6rem;
            margin-top: 1.1rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.7rem 1.4rem;
            font-size: 0.92rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s, transform 0.1s, opacity 0.15s;
        }
        button:active:not(:disabled) { transform: scale(0.97); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }

        #startBtn {
            background: var(--accent);
            color: #fff;
            flex: 1;
            min-width: 140px;
        }
        #startBtn:hover:not(:disabled) { background: var(--accent-hover); }

        #stopBtn {
            background: var(--surface-raised);
            color: var(--text);
            border: 1px solid var(--border);
        }
        #stopBtn:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

        #copyBtn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        #copyBtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

        .hint {
            margin-top: 1rem;
            font-size: 0.76rem;
            color: var(--text-muted);
            text-align: center;
        }

        @media (max-width: 520px) {
            .app { padding: 1.4rem; }
            #output { min-height: 160px; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div class="mic-badge" id="micBadge" aria-hidden="true">🎙️</div>
            <div>
                <h1>Chuyển giọng nói thành văn bản</h1>
                <p>Nhấn ghi âm và bắt đầu nói — nội dung sẽ hiển thị trực tiếp</p>
            </div>
        </header>

        <div id="status" role="status" aria-live="polite"></div>
        <div id="output" aria-label="Kết quả nhận dạng giọng nói" aria-live="polite"></div>

        <div class="toolbar">
            <button id="startBtn" aria-label="Bắt đầu ghi âm">🎙️ Bắt đầu ghi âm</button>
            <button id="stopBtn" aria-label="Dừng ghi âm" disabled>⏹ Dừng</button>
            <button id="copyBtn" aria-label="Copy kết quả">📋 Copy</button>
            <button id="clearBtn" aria-label="Xóa kết quả">🗑️ Xóa</button>
        </div>

        <p class="hint">Mẹo: nói rõ ràng, giữ micro cách miệng ~20cm. Nội dung tạm thời hiển thị màu xám nhạt.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
